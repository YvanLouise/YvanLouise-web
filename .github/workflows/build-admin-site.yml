name: Build Admin Site Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-admin-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Write admin-site env
        run: |
          echo "VITE_PUBLIC_SITE_URL=${{ secrets.ADMIN_SITE_PUBLIC_URL || 'https://www.yvanlouise.xyz' }}" > admin-site/.env.production
          echo "VITE_BASE_PATH=/" >> admin-site/.env.production

      - name: Build admin site
        run: npm run build:admin-site

      - name: Upload admin-site artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-site-dist
          path: admin-site/dist
