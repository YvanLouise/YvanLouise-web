name: Deploy Public Site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'public-site/**'
      - 'shared/**'
      - 'content/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Write public-site env
        env:
          PUBLIC_SITE_ADMIN_URL: ${{ secrets.PUBLIC_SITE_ADMIN_URL }}
          PUBLIC_SITE_CUSTOM_DOMAIN: ${{ secrets.PUBLIC_SITE_CUSTOM_DOMAIN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "$PUBLIC_SITE_CUSTOM_DOMAIN" ]; then
            BASE_PATH="/"
          else
            BASE_PATH="/$REPO_NAME/"
          fi

          echo "VITE_SITE_RUNTIME=public" > public-site/.env.production
          if [ -n "$PUBLIC_SITE_ADMIN_URL" ]; then
            echo "VITE_ADMIN_SITE_URL=$PUBLIC_SITE_ADMIN_URL" >> public-site/.env.production
          else
            echo "VITE_ADMIN_SITE_URL=https://yl-a-side.netlify.app" >> public-site/.env.production
          fi
          echo "VITE_BASE_PATH=$BASE_PATH" >> public-site/.env.production

      - name: Build public site
        run: npm run build:public-site

      - name: Write CNAME for custom domain
        env:
          PUBLIC_SITE_CUSTOM_DOMAIN: ${{ secrets.PUBLIC_SITE_CUSTOM_DOMAIN }}
        run: |
          if [ -n "$PUBLIC_SITE_CUSTOM_DOMAIN" ]; then
            echo "$PUBLIC_SITE_CUSTOM_DOMAIN" > public-site/dist/CNAME
          fi

      - name: Disable Jekyll processing
        run: touch public-site/dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4