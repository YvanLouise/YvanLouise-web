name: Monorepo CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write public-site env
        run: |
          echo "VITE_SITE_RUNTIME=public" > public-site/.env.production
          echo "VITE_BASE_PATH=/" >> public-site/.env.production

      - name: Write admin-site env
        run: |
          echo "VITE_PUBLIC_SITE_URL=${{ secrets.ADMIN_SITE_PUBLIC_URL || 'https://www.yvanlouise.xyz' }}" > admin-site/.env.production
          echo "VITE_BASE_PATH=/" >> admin-site/.env.production

      - name: Build monorepo
        run: npm run ci
