<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Yvan Louise 个人网站：音乐、软件、游戏与动画作品展示，支持委托合作与创作支持。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Yvan Louise | 个人网站</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get("p");
        if (!redirect) {
          return;
        }

        function normalizeBasePath(value) {
          var next = value || "/";
          if (next.charAt(0) !== "/") {
            next = "/" + next;
          }
          if (next.charAt(next.length - 1) !== "/") {
            next += "/";
          }
          return next;
        }

        var rawRepoBase = "%VITE_REPOSITORY_BASE%";
        if (!rawRepoBase || rawRepoBase.indexOf("%VITE_") === 0) {
          rawRepoBase = "/YvanLouise-web/";
        }

        var repoBase = normalizeBasePath(rawRepoBase);
        var basePath = /\.github\.io$/i.test(window.location.hostname) ? repoBase : "/";

        if (redirect.charAt(0) !== "/") {
          redirect = "/" + redirect;
        }

        var target = basePath === "/"
          ? redirect
          : basePath.replace(/\/$/, "") + redirect;

        window.history.replaceState(null, "", target);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
