<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>跳转中...</title>
    <script>
      (function () {
        var basePath = "%VITE_BASE_PATH%" || "/";
        if (basePath.charAt(0) !== "/") {
          basePath = "/" + basePath;
        }
        if (basePath.charAt(basePath.length - 1) !== "/") {
          basePath += "/";
        }

        var pathname = window.location.pathname;
        var route = pathname.indexOf(basePath) === 0 ? pathname.slice(basePath.length - 1) : pathname;
        var target = route + window.location.search + window.location.hash;

        window.location.replace(window.location.origin + basePath + "?p=" + encodeURIComponent(target));
      })();
    </script>
  </head>
  <body></body>
</html>
