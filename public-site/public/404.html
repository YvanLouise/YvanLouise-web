<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>跳转中...</title>
    <script>
      (function () {
        function normalizeBasePath(value) {
          var next = value || "/";
          if (next.charAt(0) !== "/") {
            next = "/" + next;
          }
          if (next.charAt(next.length - 1) !== "/") {
            next += "/";
          }
          return next;
        }

        var rawRepoBase = "%VITE_REPOSITORY_BASE%";
        if (!rawRepoBase || rawRepoBase.indexOf("%VITE_") === 0) {
          rawRepoBase = "/YvanLouise-web/";
        }

        var repoBase = normalizeBasePath(rawRepoBase);
        var basePath = /\.github\.io$/i.test(window.location.hostname) ? repoBase : "/";
        var pathname = window.location.pathname;
        var route = pathname.indexOf(basePath) === 0 ? pathname.slice(basePath.length - 1) : pathname;
        var target = route + window.location.search + window.location.hash;

        window.location.replace(window.location.origin + basePath + "?p=" + encodeURIComponent(target));
      })();
    </script>
  </head>
  <body></body>
</html>
