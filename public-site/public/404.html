<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>跳转中...</title>
    <script>
      (function () {
        var target = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(window.location.origin + "/?p=" + encodeURIComponent(target));
      })();
    </script>
  </head>
  <body></body>
</html>
